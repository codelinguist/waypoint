# Minimal same-origin serving/proxy arrangement: the browser only ever talks
# to this origin. /api/** is proxied to the backend over the private Docker
# network (never exposed with its own CORS policy to this frontend), and
# every other path serves the built single-page app, falling back to
# index.html for client-side routes.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
